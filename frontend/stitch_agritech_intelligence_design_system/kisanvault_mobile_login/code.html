<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&amp;family=Source+Sans+3:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{width:100vw;margin:0;padding:0;background-color:#FAF7F2;color:#171d16;font-family:"Source Sans 3",sans-serif;}body{overscroll-behavior:none;min-height:100vh;}.pb-safe{padding-bottom:env(safe-area-inset-bottom,0px);}.pt-safe{padding-top:env(safe-area-inset-top,0px);}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: "class", theme: { extend: { "colors": { "on-primary": "#ffffff", "on-surface": "#171d16", "outline-variant": "#C9D2C4", "tertiary": "#362406", "on-error": "#ffffff", "secondary-container": "#E0ECCE", "surface-bright": "#f5fbee", "surface-variant": "#dee5d8", "tertiary-container": "#F5E4C7", "surface-container-lowest": "#FFFFFF", "inverse-surface": "#2c322a", "surface": "#FAF7F2", "tertiary-fixed-dim": "#e0c297", "surface-dim": "#d6dcd0", "surface-container-high": "#E4DECF", "on-tertiary-fixed-variant": "#584322", "secondary": "#4f6442", "on-tertiary-container": "#2C1E07", "primary-container": "#244523", "error": "#9E2A2B", "surface-container": "#eaf0e3", "surface-container-low": "#F5F1E8", "on-background": "#171d16", "on-secondary-fixed": "#0d2005", "on-primary-fixed-variant": "#2d4e2b", "surface-tint": "#446741", "on-surface-variant": "#424840", "on-primary-fixed": "#012104", "on-secondary-container": "#536946", "on-tertiary": "#ffffff", "surface-container-highest": "#dee5d8", "on-secondary": "#ffffff", "background": "#f5fbee", "on-primary-container": "#8db387", "primary-fixed": "#c5edbe", "secondary-fixed": "#d1eabf", "inverse-primary": "#aad1a3", "on-secondary-fixed-variant": "#384c2c", "border-subtle": "#E2DDD2", "tertiary-fixed": "#fedeb1", "inverse-on-surface": "#edf3e6", "primary": "#0d2e0f", "secondary-fixed-dim": "#b5cea4", "outline": "#7E887B", "error-container": "#ffdad6", "primary-fixed-dim": "#aad1a3", "on-error-container": "#93000a", "on-tertiary-fixed": "#281800" }, "borderRadius": { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, "spacing": { "margin": "1.5rem", "space-xs": "0.25rem", "space-md": "0.75rem", "gutter-mobile": "0.75rem", "unit": "4px", "space-sm": "0.5rem", "margin-mobile": "1rem", "space-lg": "1rem", "space-xl": "1.5rem", "gutter": "1rem" }, "fontFamily": { "display": ["Newsreader"], "title": ["\"Source Sans 3\""], "label-md": ["\"Source Sans 3\""], "display-mobile": ["Newsreader"], "headline-lg-mobile": ["Newsreader"], "headline-md": ["Newsreader"], "label-lg": ["\"Source Sans 3\""], "headline-sm": ["Newsreader"], "body-lg": ["\"Source Sans 3\""], "body-sm": ["\"Source Sans 3\""], "body-md": ["\"Source Sans 3\""], "headline-lg": ["Newsreader"], "label-sm": ["\"Source Sans 3\""] }, "fontSize": { "display": ["40px", { "lineHeight": "48px", "fontWeight": "600" }], "title": ["18px", { "lineHeight": "26px", "fontWeight": "600" }], "label-md": ["14px", { "lineHeight": "20px", "fontWeight": "600" }], "display-mobile": ["32px", { "lineHeight": "40px", "fontWeight": "600" }], "headline-lg-mobile": ["26px", { "lineHeight": "34px", "fontWeight": "500" }], "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "500" }], "label-lg": ["16px", { "lineHeight": "24px", "fontWeight": "600" }], "headline-sm": ["20px", { "lineHeight": "28px", "fontWeight": "600" }], "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }], "body-sm": ["14px", { "lineHeight": "20px", "fontWeight": "400" }], "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }], "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "500" }], "label-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.02em", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface font-body-md text-body-md text-on-surface min-h-screen flex flex-col pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface px-margin-mobile"><div class="flex flex-col w-full pb-space-xl">
<!-- Top Visual Banner with Organic Gradient Falloff -->
<div class="relative w-full h-48 -mx-margin-mobile px-margin-mobile overflow-hidden flex flex-col justify-end">
<div class="absolute inset-0 bg-cover bg-center" data-alt="Wide lush rural agricultural landscape with golden morning sunlight casting warm glows across wheat fields, a freshwater irrigation canal, distant earthen village homes, and farmers tending green crops under a serene sky. Warm organic parchment and deep foliage aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuD3XNBrTydHzGCKxQ4KwhZD4jVYaavCrW9xtpHfWp2WadjOyNAn2T6J-1MDnM14klsg7ql3gXFpjJxyKK4fIjSfki9oNt114Q3j2pHpXsyJJHTbsve-89FgANIe7iJ6c8vAnGyTXdskD2D7YFzAqBiIJT2UDs4bWZP_ApSVYabGYIAy1H_hmn_wCHcug7pJZ4yD4hRlYVIEJko9FPb_vrUZdh1XuGtb6mQX4xI0AiwFVRxt3CtWhZHc')">
</div>
<!-- Natural gradient blend into surface canvas -->
<div class="absolute inset-0 bg-gradient-to-b from-primary/20 via-surface/60 to-surface"></div>
<!-- Floating Emblem / Brand Pill -->
<div class="relative z-10 flex items-center space-x-space-sm mb-space-sm bg-surface-container-lowest/90 backdrop-blur-sm self-start px-space-md py-1.5 rounded-full shadow-sm">
<span class="material-symbols-outlined text-primary-container text-[20px]" style="font-variation-settings: 'FILL' 1;">potted_plant</span>
<span class="font-title text-label-md text-primary tracking-tight font-semibold">KisanVault</span>
</div>
</div>
<!-- Content Block -->
<div class="flex flex-col w-full mt-space-sm">
<!-- Eyebrow & Main Headings -->
<p class="font-label-sm text-label-sm uppercase tracking-wider text-secondary font-semibold mb-1">
      Welcome back
    </p>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface font-medium leading-tight">
      Your farm history is waiting.
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-1.5 mb-space-lg">
      Sign in to access your fields, records, harvests and farm insights.
    </p>
<!-- Sign In Form -->
<form class="flex flex-col w-full space-y-space-lg" id="loginForm" onsubmit="event.preventDefault(); handleSignIn();">
<!-- Email Field -->
<div class="flex flex-col space-y-1.5">
<label class="font-label-md text-label-md text-on-surface font-medium" for="farmer-email">
          Email address
        </label>
<div class="relative flex items-center">
<input autocomplete="email" class="w-full h-12 px-space-md bg-surface-container-lowest text-on-surface rounded-xl font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-bright shadow-sm transition-colors" id="farmer-email" placeholder="farmer@example.com" required="" type="email"/>
<span class="material-symbols-outlined absolute right-space-md text-outline pointer-events-none text-[20px]">
            mail
          </span>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-1.5">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface font-medium" for="farmer-pass">
            Password
          </label>
<a class="font-label-sm text-label-sm text-secondary font-semibold hover:text-primary transition-colors py-1" href="#forgot">
            Forgot password?
          </a>
</div>
<div class="relative flex items-center">
<input autocomplete="current-password" class="w-full h-12 pl-space-md pr-12 bg-surface-container-lowest text-on-surface rounded-xl font-body-md text-body-md placeholder:text-outline focus:outline-none focus:bg-surface-bright shadow-sm transition-colors" id="farmer-pass" placeholder="Enter your password" required="" type="password"/>
<button aria-label="Toggle password visibility" class="absolute right-0 h-12 w-12 flex items-center justify-center text-outline hover:text-on-surface transition-colors focus:outline-none" id="togglePassBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passIcon">
              visibility
            </span>
</button>
</div>
</div>
<!-- Primary Action -->
<div class="pt-space-xs">
<button class="w-full h-[52px] bg-primary-container text-on-primary rounded-xl font-label-lg text-label-lg font-semibold flex items-center justify-center space-x-2 shadow-sm active:scale-[0.99] transition-transform select-none" id="submitBtn" type="submit">
<span>Sign in</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</div>
</form>
<!-- Warm Calming Value Promise -->
<div class="mt-space-lg bg-surface-container-low p-space-md rounded-xl flex items-center space-x-space-md">
<div class="w-10 h-10 rounded-lg bg-secondary-container flex items-center justify-center text-on-secondary-container shrink-0">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">shield</span>
</div>
<p class="font-body-sm text-body-sm text-on-surface-variant">
        A calm, secure repository dedicated to your soil, yields, and seasons.
      </p>
</div>
<!-- Registration Link -->
<div class="mt-space-xl flex flex-col items-center justify-center py-space-sm text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
        New to KisanVault?
        <a class="font-label-md text-label-md text-primary font-semibold underline underline-offset-4 ml-1 hover:text-secondary transition-colors inline-block py-2" href="#register">
          Create an account
        </a>
</p>
</div>
</div>
</div>
<script>
  function togglePasswordVisibility() {
    const input = document.getElementById('farmer-pass');
    const icon = document.getElementById('passIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function handleSignIn() {
    const btn = document.getElementById('submitBtn');
    const originalText = btn.innerHTML;
    btn.innerHTML = `
      <span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>
      <span>Opening vault...</span>
    `;
    btn.disabled = true;
    setTimeout(() => {
      btn.innerHTML = originalText;
      btn.disabled = false;
    }, 1200);
  }
</script></main></body></html>
